<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jleilati Spices — Coming Soon</title>
    <meta name="description" content="Jleilati Spices is coming soon." />
    <style>
      :root {
        --gold: #e2b64b;
        --cream: #fff7e8;
        --ink: #080a07;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background: var(--ink);
        color: var(--cream);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .page {
        position: relative;
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 2rem;
        text-align: center;
        isolation: isolate;
      }

      video {
        position: fixed;
        inset: 0;
        z-index: -2;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .page::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
          radial-gradient(circle at center, rgba(8, 10, 7, 0.18), rgba(8, 10, 7, 0.72)),
          linear-gradient(180deg, rgba(8, 10, 7, 0.16), rgba(8, 10, 7, 0.82));
      }

      main {
        display: grid;
        gap: 1.5rem;
        width: min(52rem, 100%);
      }

      .coming-soon {
        position: relative;
        display: grid;
        min-height: clamp(4.2rem, 12vw, 11rem);
        place-items: center;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .coming-soon li {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: var(--cream);
        font-size: clamp(1.7rem, 5vw, 4.8rem);
        font-weight: 950;
        line-height: 1.08;
        opacity: 0;
        text-shadow: 0 0.2rem 1.4rem rgba(0, 0, 0, 0.5);
        transform: translateY(0.45rem);
        animation: languageFade 12s infinite;
      }

      .coming-soon li:first-child {
        color: var(--gold);
        direction: rtl;
      }

      .coming-soon li:nth-child(2) {
        animation-delay: 3s;
      }

      .coming-soon li:nth-child(3) {
        animation-delay: 6s;
      }

      .coming-soon li:nth-child(4) {
        animation-delay: 9s;
      }

      @keyframes languageFade {
        0%,
        7% {
          opacity: 0;
          transform: translateY(0.45rem);
        }

        12%,
        25% {
          opacity: 1;
          transform: translateY(0);
        }

        32%,
        100% {
          opacity: 0;
          transform: translateY(-0.45rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .coming-soon li {
          animation: none;
        }

        .coming-soon li:first-child {
          opacity: 1;
          transform: none;
        }
      }

      .socials {
        display: flex;
        justify-content: center;
        gap: 0.8rem;
      }

      .socials a {
        display: inline-grid;
        width: 3.2rem;
        height: 3.2rem;
        place-items: center;
        border: 1px solid rgba(226, 182, 75, 0.72);
        border-radius: 999px;
        color: var(--cream);
        background: rgba(8, 10, 7, 0.42);
        text-decoration: none;
      }

      .socials svg {
        width: 1.35rem;
        height: 1.35rem;
        fill: currentColor;
      }

      @media (max-width: 640px) {
        body {
          overflow: auto;
        }

        .page {
          padding: 1.25rem;
        }

        .socials a {
          width: 2.9rem;
          height: 2.9rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <video autoplay muted loop playsinline poster="assets/hero-spice-market.png">
        <source src="assets/coming-soon-spices.mp4" type="video/mp4" />
      </video>

      <main aria-label="Coming soon">
        <ul class="coming-soon">
          <li lang="ar">بزورية جليلاتي — قريباً</li>
          <li>Jleilati Spices — Coming Soon</li>
          <li lang="fr">Épices Jleilati — Bientôt en ligne</li>
          <li lang="de">Jleilati Gewürze — Bald online</li>
        </ul>

        <nav class="socials" aria-label="Social media">
          <a href="https://www.instagram.com/jleilati_gewurze" target="_blank" rel="noreferrer" aria-label="Instagram">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7Zm5 3.5A4.5 4.5 0 1 1 12 16.5 4.5 4.5 0 0 1 12 7.5Zm0 2A2.5 2.5 0 1 0 12 14.5 2.5 2.5 0 0 0 12 9.5ZM17.75 6.25a1 1 0 1 1-1 1 1 1 0 0 1 1-1Z" />
            </svg>

            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M14 8h3V4h-3c-3.1 0-5 1.9-5 5v2H6v4h3v7h4v-7h3.2l.8-4h-4V9c0-.7.3-1 1-1Z" />

        </nav>
      </main>
    </div>
  </body>
</html>
